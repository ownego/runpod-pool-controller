# Needs Secret runpod-pool-controller with key RUNPOD_API_KEY:
#   kubectl -n runpod create secret generic runpod-pool-controller \
#     --from-literal=RUNPOD_API_KEY=<key>
# A Read Only key is enough while every pool is Observe or DryRun; Manage
# mode needs an All key (RunPod has no pods-only scope).
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: runpod
  name: runpod-pool-controller
spec:
  # Exactly one: two controllers would race on status and on RunPod creates.
  # Recreate keeps it at most one during upgrades.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: runpod-pool-controller
  template:
    metadata:
      labels:
        app: runpod-pool-controller
    spec:
      serviceAccountName: runpod-pool-controller
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      containers:
        - name: controller
          image: ownego/runpod-pool-controller:0.5.0
          env:
            # Optional: without it the RelativeLatency and ErrorRate rules
            # are off. Must reach the Prometheus that scrapes the pods.
            - name: PROMETHEUS_URL
              value: http://prometheus-operated.monitoring.svc:9090
            # Default 30, spelled out: each loop is one RunPod list call
            # plus 2 HTTP probes per pod.
            - name: RECONCILE_INTERVAL
              value: "30"
            # NAMESPACE defaults to the controller's own namespace;
            # CRD_GROUP to runpodpool.ownego.com.
            - name: RUNPOD_API_KEY
              valueFrom:
                secretKeyRef:
                  name: runpod-pool-controller
                  key: RUNPOD_API_KEY
          ports:
            - name: http
              containerPort: 8080
          # /healthz turns 503 after 5 missed reconcile loops.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            # Average CPU is a few millicores, but each loop opens several
            # TLS connections at once; a tight CPU limit throttles that burst
            # into probe timeouts. Memory stays near 20Mi.
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 64Mi
---
# Serves /metrics (runpod_pool_*), /healthz and /sd/<pool> (Prometheus HTTP
# service discovery for the pool's pods).
apiVersion: v1
kind: Service
metadata:
  namespace: runpod
  name: runpod-pool-controller
  labels:
    app: runpod-pool-controller
spec:
  selector:
    app: runpod-pool-controller
  ports:
    - name: http
      port: 8080
      targetPort: http
