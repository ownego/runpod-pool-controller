# Create ONCE, before the pool: an empty slots ConfigMap for nginx to
# include. From then on the controller owns it and rewrites it as pods come
# and go; re-applying this file would empty the pool's nginx. Generated with
# runpod_pool.nginx.render("inference", {}, 8081).
#
# To take over pods you already run instead, render their slots:
#   python3 -c 'from runpod_pool import nginx; print(nginx.render("inference", {8081: "<pod id>"}, 8081))'
# and list the same IDs under spec.adopt.
apiVersion: v1
kind: ConfigMap
metadata:
  namespace: runpod
  name: inference-nginx-slots
data:
  upstream.conf: |
    # Generated by runpod-pool-controller for pool inference. Do not edit:
    # changes are overwritten on the next reconcile.
    server 127.0.0.1:8081 down;
  slots.conf: |
    # Generated by runpod-pool-controller for pool inference. Do not edit:
    # changes are overwritten on the next reconcile.
    # no Ready members
  metrics-pin.conf: |
    # Generated by runpod-pool-controller for pool inference. Do not edit:
    # changes are overwritten on the next reconcile.
    location = /metrics {
      return 503;
    }
