{{- if .Values.runpodApiKey.value }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rpp.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rpp.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.runpodApiKey.key }}: {{ .Values.runpodApiKey.value | quote }}
{{- end }}
