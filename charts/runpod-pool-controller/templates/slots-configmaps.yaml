{{- /*
The slots ConfigMap nginx includes, created once and empty. The controller
owns its content from then on, so it is rendered only while it does not
exist yet (lookup), and kept when it drops out of the manifest or the
release is uninstalled (resource-policy keep). Matches
runpod_pool.nginx.render(<pool>, {}, <basePort>).
*/ -}}
{{- range .Values.pools }}
{{- if ne (toString .createSlotsConfigMap) "false" }}
{{- $name := include "rpp.slotsConfigMap" . }}
{{- $ns := include "rpp.watchNamespace" $ }}
{{- if not (lookup "v1" "ConfigMap" $ns $name) }}
{{- $nginx := default dict .spec.nginx }}
{{- $base := int (default 8081 $nginx.basePort) }}
{{- $header := printf "# Generated by runpod-pool-controller for pool %s. Do not edit:\n# changes are overwritten on the next reconcile.\n" .name }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "rpp.labels" $ | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
data:
  upstream.conf: {{ printf "%sserver 127.0.0.1:%d down;\n" $header $base | quote }}
  slots.conf: {{ printf "%s# no Ready members\n" $header | quote }}
  metrics-pin.conf: {{ printf "%slocation = /metrics {\n  return 503;\n}\n" $header | quote }}
{{- end }}
{{- end }}
{{- end }}
